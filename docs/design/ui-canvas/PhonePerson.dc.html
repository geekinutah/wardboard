<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — person sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #18212B">
  <!-- Background screen -->
  <div aria-hidden="true" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 22px; font-weight: 600">Primary</span>
    <div style="height: 56px; background: #FFFFFF; border-radius: 12px"></div>
    <div style="height: 56px; background: #FFFFFF; border-radius: 12px"></div>
    <div style="height: 56px; background: #FFFFFF; border-radius: 12px"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(24,33,43,0.4)"></div>

  <div role="dialog" aria-labelledby="pp-t" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 18px 18px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 24px rgba(0,0,0,0.15)">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C8CDC7"></span>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 56px; height: 56px; border-radius: 50%; background: #7B4A6A; color: #FFFFFF; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center">MP</span>
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
        <h2 id="pp-t" style="margin: 0; font-size: 19px; font-weight: 600">Muriel Price <span style="font-size: 13px; font-weight: 400; color: #55606B">· Adult</span></h2>
        <div style="display: flex; gap: 4px"><span style="font-size: 12px; background: #ECEEEA; border-radius: 4px; padding: 2px 7px">Teaching</span><span style="font-size: 12px; background: #ECEEEA; border-radius: 4px; padding: 2px 7px">Pianist</span></div>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border: none; background: #F3F4F1; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#18212B" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55606B">Callings in Spring adjustments</h3>
      <sc-for list="{{callings}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #E1E4DF; border-radius: 12px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{c.title}}</span><span style="font-size: 12px; color: #55606B">{{c.org}}</span></span>
          <div style="display: flex; gap: 8px">
            <a href="Mobile.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #D9DDD8; border-radius: 10px; font-size: 14px; text-decoration: none; color: #18212B">Move…</a>
            <button style="flex: 1; height: 44px; border: 1px solid #D9DDD8; background: #FFFFFF; border-radius: 10px; font-size: 14px; cursor: pointer; color: #18212B">Release</button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border: 1px solid #D9DDD8; background: #FFFFFF; border-radius: 12px; font-size: 15px; cursor: pointer; color: #18212B; text-align: left">
        <span>Add to dugout</span><span style="font-size: 12px; color: #55606B">keeps her callings</span>
      </button>
    </div>
    <a href="#" style="font-size: 14px; color: #1D5C68; font-weight: 600; text-decoration: none; text-align: center">Profile, note &amp; photo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      callings: [
        { title: 'Teacher (age 7)', org: 'Primary · Teachers' },
        { title: 'Choir accompanist', org: 'Ward-wide · Music' }
      ]
    };
  }
}
</script>
</body>
</html>
