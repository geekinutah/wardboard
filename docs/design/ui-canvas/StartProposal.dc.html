<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current is read-only — start a proposal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 820px; position: relative; overflow: hidden; box-sizing: border-box; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #18212B">

  <!-- Current header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9DDD8; padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 64px">
    <span style="font-weight: 700; font-size: 17px">WardBoard</span>
    <span style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #18212B; background: #F3F4F1; border-radius: 8px; font-size: 13px; font-weight: 600">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Current
    </span>
    <span style="font-size: 13px; color: #3A444F">Read-only · imported <strong>Oct 24, 2026</strong></span>
    <span style="flex: 1"></span>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid #D9DDD8; border-radius: 8px; width: 280px; box-sizing: border-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55606B" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search people, callings, tags</span>
      <input type="search" placeholder="People, callings, tags…" style="border: none; outline: none; font: inherit; font-size: 14px; flex: 1; min-width: 0; background: transparent">
    </label>
    <button style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border: none; background: #1D5C68; color: #FFFFFF; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Start proposal
    </button>
  </header>

  <!-- Current board (no drag affordances) -->
  <div aria-hidden="true" style="padding: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{orgs}}" as="o" hint-placeholder-count="8">
      <div style="background: #FFFFFF; border: 1px solid #D9DDD8; border-radius: 12px; padding: 14px; height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
        <div style="display: flex; gap: 8px">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #9AA8B2"></span>
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #A9A08A"></span>
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #93A897"></span>
        </div>
        <span style="font-size: 12px; color: #8A4209; font-weight: 600">{{o.vac}} vacant</span>
      </div>
    </sc-for>
  </div>

  <!-- Dialog -->
  <div style="position: absolute; inset: 0; background: rgba(24,33,43,0.5); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-modal="true" aria-labelledby="sp-t" style="width: 560px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.3); padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <h2 id="sp-t" style="margin: 0; font-size: 20px; font-weight: 600">Start a proposal</h2>
      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Start from</legend>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 2px solid #1D5C68; background: #E3EEEF; border-radius: 10px; cursor: pointer">
          <input type="radio" name="src" checked style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #1D5C68">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Current</span><span style="font-size: 12px; color: #3A444F">Baseline is today's Current (Oct 24 import)</span></span>
        </label>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid #D9DDD8; border-radius: 10px; cursor: pointer">
          <input type="radio" name="src" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #1D5C68">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Duplicate “Spring adjustments”</span><span style="font-size: 12px; color: #3A444F">Copies its arrangement; keeps its Oct 19 baseline</span></span>
        </label>
      </fieldset>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
        Name
        <input type="text" value="Primary staffing" style="height: 42px; padding: 0 12px; border: 1px solid #B9BEC4; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">
        Rationale <span style="font-weight: 400; color: #55606B">(optional)</span>
        <textarea rows="2" placeholder="Why are we considering this?" style="padding: 10px 12px; border: 1px solid #B9BEC4; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; resize: none"></textarea>
      </label>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <button style="height: 44px; padding: 0 18px; border: 1px solid #D9DDD8; background: #FFFFFF; border-radius: 8px; font-size: 14px; cursor: pointer; color: #18212B">Cancel</button>
        <button style="height: 44px; padding: 0 18px; border: none; background: #1D5C68; color: #FFFFFF; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">Create proposal</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { orgs: ['Bishopric', 'Elders Quorum', 'Relief Society', 'Aaronic Priesthood', 'Young Women', 'Primary', 'Sunday School', 'Ward-wide'].map((name, i) => ({ name, vac: [1, 2, 3, 2, 3, 5, 1, 3][i] })) };
  }
}
</script>
</body>
</html>
