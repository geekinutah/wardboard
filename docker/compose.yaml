name: wardboard

services:
  wardboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Loopback only: tailscale serve on the host forwards tailnet traffic here.
      - "127.0.0.1:${WARDBOARD_PORT:-8080}:8080"
    environment:
      # Required, no default: the app's URL as the host/tailnet sees it.
      WARDBOARD_BASE_URL: ${WARDBOARD_BASE_URL}
      WARDBOARD_INITIAL_ADMIN_LOGIN: ${WARDBOARD_INITIAL_ADMIN_LOGIN}
    volumes:
      # Named volume rather than a host bind mount: SQLite WAL locking stays
      # on the Docker engine's filesystem.
      - wardboard-data:/data
    restart: unless-stopped

volumes:
  wardboard-data:
