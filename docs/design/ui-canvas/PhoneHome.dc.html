<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #18212B; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9DDD8; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="PhoneTabs.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid #1D5C68; background: #E3EEEF; border-radius: 8px; font-size: 14px; font-weight: 600; color: #123E47; text-decoration: none">
        <span style="font-size: 10px; letter-spacing: 0.08em; background: #1D5C68; color: #FFFFFF; padding: 2px 5px; border-radius: 3px">PROPOSED</span>
        Spring adjustments
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #2E6B3A"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="#2E7D44"></circle></svg>Live</span>
    </div>
    <span style="font-size: 12px; color: #55606B">+4 callings · −3 releases · 20 vacant</span>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{orgs}}" as="o" hint-placeholder-count="8">
      <a href="{{o.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #D9DDD8; border-radius: 12px; text-decoration: none; color: #18212B; box-sizing: border-box">
        <div style="display: flex; flex: none">
          <span style="width: 28px; height: 28px; border-radius: 50%; background: #2F5D8A; border: 2px solid #FFFFFF"></span>
          <span style="width: 28px; height: 28px; border-radius: 50%; background: #7A5C2E; border: 2px solid #FFFFFF; margin-left: -10px"></span>
          <span style="width: 28px; height: 28px; border-radius: 50%; background: {{o.third}}; border: {{o.thirdBorder}}; margin-left: -10px; box-sizing: border-box"></span>
        </div>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
          <span style="font-size: 12px; color: #55606B">{{o.changes}}</span>
        </span>
        <span style="font-size: 12px; font-weight: 600; color: #8A4209; background: #FBEFE3; border: 1px dashed #C9772E; border-radius: 6px; padding: 2px 7px">{{o.vac}}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A929A" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Main" style="background: #FFFFFF; border-top: 1px solid #D9DDD8; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 72px; padding-bottom: 8px; box-sizing: border-box">
    <a href="PhoneHome.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #1D5C68; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Board</a>
    <a href="PhoneSearch.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #55606B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
    <a href="PhoneDugout.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #55606B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg>Dugout · 14</a>
    <a href="PhoneChanges.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #55606B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v6M9 8h6M9 17h6"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>Changes · 7</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [['Bishopric', 1, 'No changes'], ['Elders Quorum', 2, '1 proposed change'], ['Relief Society', 3, '2 proposed changes'], ['Aaronic Priesthood', 2, 'No changes'], ['Young Women', 3, '1 proposed change'], ['Primary', 5, '1 proposed change'], ['Sunday School', 1, '1 proposed change'], ['Ward-wide Callings', 3, '1 proposed change']];
    return {
      orgs: rows.map(([name, v, changes]) => ({
        name, changes, vac: v + ' vacant',
        href: name === 'Primary' ? 'PhoneOrg.dc.html' : '#',
        third: (name === 'Primary' || name === 'Young Women') ? '#FFF8F1' : '#3F6E4E',
        thirdBorder: (name === 'Primary' || name === 'Young Women') ? '2px dashed #C9772E' : '2px solid #FFFFFF'
      }))
    };
  }
}
</script>
</body>
</html>
