name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up environment
        env:
          # Playwright browsers on Ubuntu need system libraries (--with-deps).
          WARDBOARD_PLAYWRIGHT_WITH_DEPS: '1'
        run: ./scripts/setup.sh

      - name: Quality gate
        run: ./scripts/verify.sh

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Docker ships with GitHub runners. The smoke script builds the image,
      # runs the end-to-end checks, and cleans up after itself.
      - name: Docker smoke test
        run: ./scripts/docker-smoke.sh
