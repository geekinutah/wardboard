<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — proposals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #18212B">
  <div aria-hidden="true" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 44px; width: 220px; background: #FFFFFF; border-radius: 8px"></div>
    <div style="height: 64px; background: #FFFFFF; border-radius: 12px"></div>
    <div style="height: 64px; background: #FFFFFF; border-radius: 12px"></div>
    <div style="height: 64px; background: #FFFFFF; border-radius: 12px"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(24,33,43,0.4)"></div>

  <div role="dialog" aria-labelledby="pt-t" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 18px 18px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 24px rgba(0,0,0,0.15)">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C8CDC7"></span>
    <h2 id="pt-t" style="margin: 0; font-size: 19px; font-weight: 600">Boards</h2>

    <a href="PhoneHome.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px; border: 1px solid #D9DDD8; border-radius: 12px; text-decoration: none; color: #18212B; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A444F" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 15px; font-weight: 600">Current</span><span style="font-size: 12px; color: #55606B">Read-only · imported Oct 24</span></span>
    </a>

    <h3 style="margin: 4px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #55606B">Proposals</h3>
    <sc-for list="{{proposals}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 8px 4px 8px 12px; border: {{p.border}}; background: {{p.bg}}; border-radius: 12px; box-sizing: border-box">
        <a href="PhoneHome.dc.html" aria-current="{{p.current}}" style="display: flex; flex-direction: column; flex: 1; text-decoration: none; color: #18212B">
          <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 12px; color: #3A444F">{{p.sub}}</span>
        </a>
        <button aria-label="Options for {{p.name}}" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#3A444F" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
      </div>
    </sc-for>

    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; margin-top: 4px; border: none; background: #1D5C68; color: #FFFFFF; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Start proposal
    </button>
    <span style="font-size: 12px; color: #55606B; text-align: center">Each person picks their own board; switching here never changes anyone else's view.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      proposals: [
        { name: 'Spring adjustments', sub: '7 changes · 2 removed items · Bishop H. viewing', border: '2px solid #1D5C68', bg: '#E3EEEF', current: 'page' },
        { name: 'Youth focus', sub: '3 changes · baseline Oct 19', border: '1px solid #D9DDD8', bg: '#FFFFFF', current: 'false' }
      ]
    };
  }
}
</script>
</body>
</html>
