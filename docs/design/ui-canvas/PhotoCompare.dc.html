<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replace photo comparison</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 880px; height: 620px; box-sizing: border-box; background: rgba(24,33,43,0.55); font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #18212B; display: flex; align-items: center; justify-content: center; padding: 32px">
  <div role="dialog" aria-modal="true" aria-labelledby="pc-t" style="width: 640px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.3); padding: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <h2 id="pc-t" style="margin: 0; font-size: 20px; font-weight: 600">Replace Kim Nguyen's photo?</h2>
      <span style="font-size: 13px; color: #55606B">Directory import · 3 of 12</span>
    </div>
    <div style="height: 4px; background: #ECEEEA; border-radius: 2px"><div style="width: 25%; height: 4px; background: #1D5C68; border-radius: 2px"></div></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid #D9DDD8; border-radius: 12px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #55606B">CURRENT</span>
        <div role="img" aria-label="Current portrait placeholder" style="width: 200px; height: 200px; align-self: center; border-radius: 10px; background: #355C66; color: #FFFFFF; font-size: 48px; font-weight: 600; display: flex; align-items: center; justify-content: center">KN</div>
        <figcaption style="font-size: 12px; color: #55606B">Uploaded by Mike S. · Oct 2</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 2px solid #1D5C68; border-radius: 12px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #1D5C68">INCOMING</span>
        <div role="img" aria-label="Incoming portrait placeholder" style="width: 200px; height: 200px; align-self: center; border-radius: 10px; background: #5A7F88; color: #FFFFFF; font-size: 48px; font-weight: 600; display: flex; align-items: center; justify-content: center">KN</div>
        <figcaption style="font-size: 12px; color: #55606B">Individual portrait · ward directory</figcaption>
      </figure>
    </div>

    <span style="font-size: 12px; color: #55606B">2 household images were skipped — they aren't offered as portraits.</span>

    <div style="display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap">
      <button style="height: 44px; padding: 0 16px; border: none; background: transparent; border-radius: 8px; font-size: 14px; cursor: pointer; color: #3A444F">Cancel import</button>
      <div style="display: flex; gap: 8px">
        <button style="height: 44px; padding: 0 18px; border: 1px solid #D9DDD8; background: #FFFFFF; border-radius: 8px; font-size: 14px; cursor: pointer; color: #18212B">Keep Current</button>
        <button style="height: 44px; padding: 0 18px; border: none; background: #1D5C68; color: #FFFFFF; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer">Use New Photo</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
